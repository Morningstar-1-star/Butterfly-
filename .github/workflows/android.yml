name: Butterfly Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Download Gradle 9.3.1
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Generate Gradle Wrapper
        run: |
          /tmp/gradle-9.3.1/bin/gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin
          chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Butterfly-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save Gradle Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet || git commit -m "Add Gradle wrapper"
          git push
