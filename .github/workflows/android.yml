name: Build & Release Butterfly APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Make Gradle executable
        run: chmod +x ./gradlew || true

      - name: Extract App Version from Gradle
        id: app_version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*' app/build.gradle.kts | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.0.5-alpha"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="5"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${VERSION_NAME}.${VERSION_CODE}" >> $GITHUB_ENV
          echo "Detected App Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Prepare Keystore & Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-apk
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Found Release Keystore secrets. Building signed Release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            export STORE_PASSWORD="$STORE_PASSWORD"
            export KEY_PASSWORD="$KEY_PASSWORD"
            ./gradlew :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/*.apk release-apk/Butterfly-${VERSION_NAME}.apk
          else
            echo "Release signing secrets not found in GitHub repository secrets."
            echo "Building APK with repository fixed keystore for consistent signature..."
            ./gradlew :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/*.apk release-apk/Butterfly-${VERSION_NAME}.apk
          fi

      - name: Generate update.json Metadata
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo 65000000)
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "{\"versionName\": \"$VERSION_NAME\", \"versionCode\": $VERSION_CODE, \"tagName\": \"$RELEASE_TAG\", \"downloadUrl\": \"https://github.com/Morningstar-1-star/Butterfly-/releases/download/$RELEASE_TAG/$APK_NAME\", \"apkName\": \"$APK_NAME\", \"apkSize\": $APK_SIZE, \"publishedAt\": \"$CURRENT_DATE\", \"changelog\": [\"Connected to Butterfly-MediaServer canonical API\", \"Removed local torrent and bundled JS bloat for lighter APK\", \"Hardened TLS security and Room database migrations\", \"Updated core AndroidX, Compose, Media3, and yt-dlp dependencies\"]}" > release-apk/update.json

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Butterfly-${{ env.VERSION_NAME }}-v${{ env.VERSION_CODE }}
          path: release-apk/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Butterfly v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          make_latest: "true"
          files: |
            release-apk/*.apk
            release-apk/update.json
          body: |
            ## Butterfly v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            versionCode: ${{ env.VERSION_CODE }}

            ### What's New in v${{ env.VERSION_NAME }}:
            - Connected directly to Butterfly-MediaServer canonical API
            - Removed local torrent & bundled JS assets for a significantly smaller, faster APK
            - Hardened TLS security, Auto Backup exclusions, and Room database migrations
            - Updated AndroidX, Compose, Media3, NewPipeExtractor, and yt-dlp dependencies

            **Commit:** ${{ github.sha }}
